[project]
name = "benchmark-errata"
version = "0.1.0"
description = "Patches for defects in public agent-benchmark tasks, applied by task id until upstream fixes them."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pyright>=1.1.390", "pytest>=9.0.3", "ruff>=0.15.14"]

[project.scripts]
benchmark-errata = "benchmark_errata.cli:main"

[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "benchmark_errata"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
