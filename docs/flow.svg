<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="700" viewBox="100 0 1110 700" role="img" aria-label="Benchmark errata flow: admission, release gates, lifecycle and use in a runner">
  <title>Benchmark errata flow: admission, release gates, lifecycle and use in a runner</title>
  <desc>A review finding is first split into environment faults, which are fixed where they run, and task defects of four classes. A task defect becomes an erratum record with a patch, passes release gates, and enters the active status. A runner materializes tasks from the pinned source, applies active and upstream_fixed errata by task id, applies its own edits, prepares images, runs trials and reports the errata used. When upstream fixes the task and the runner pins the fixed source, the erratum retires.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344054"/>
    </marker>
    <style>
      .tasks { fill: #f4ecfa; stroke: #7a4aa0; stroke-width: 2; }
      .runner { fill: #f2f4f7; stroke: #475467; stroke-width: 2; }
      .envfix { fill: #fff4e5; stroke: #b85c00; stroke-width: 2; }
      .decision { fill: #edf4ff; stroke: #3974b8; stroke-width: 2; }
      .label { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1d2939; }
      .small { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #344054; }
      .edge { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #344054; }
      .line { stroke: #344054; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="100" y="0" width="1110" height="700" fill="#ffffff"/>
  <rect x="130" y="60" width="200" height="120" rx="6" class="runner" data-series="runner"/>
  <text x="230.0" y="105.0" text-anchor="middle" class="label">Review finding</text>
  <text x="230.0" y="125.0" text-anchor="middle" class="small">cells</text>
  <text x="230.0" y="145.0" text-anchor="middle" class="small">+ task bytes</text>
  <rect x="370" y="60" width="280" height="120" rx="6" class="decision" data-series="decision"/>
  <text x="510" y="100" text-anchor="middle" class="label">Defect persists in a</text>
  <text x="510" y="122" text-anchor="middle" class="label">correctly configured</text>
  <text x="510" y="144" text-anchor="middle" class="label">environment?</text>
  <rect x="700" y="60" width="220" height="120" rx="6" class="tasks" data-series="benchmark-errata"/>
  <text x="810.0" y="85.0" text-anchor="middle" class="label">Task defect</text>
  <text x="810.0" y="105.0" text-anchor="middle" class="small">instruction_gap</text>
  <text x="810.0" y="125.0" text-anchor="middle" class="small">grader_bug</text>
  <text x="810.0" y="145.0" text-anchor="middle" class="small">image_residue</text>
  <text x="810.0" y="165.0" text-anchor="middle" class="small">starter_mismatch</text>
  <rect x="960" y="60" width="210" height="120" rx="6" class="tasks" data-series="benchmark-errata"/>
  <text x="1065.0" y="105.0" text-anchor="middle" class="label">Erratum record</text>
  <text x="1065.0" y="125.0" text-anchor="middle" class="small">registry.json</text>
  <text x="1065.0" y="145.0" text-anchor="middle" class="small">+ patch, hashes</text>
  <path d="M 330 120 L 366 120" class="line"/>
  <path d="M 650 120 L 696 120" class="line"/>
  <text x="675" y="110" text-anchor="middle" class="edge">yes</text>
  <path d="M 920 120 L 956 120" class="line"/>
  <path d="M 510 180 L 510 216" class="line"/>
  <text x="522" y="204" text-anchor="start" class="edge">no</text>
  <rect x="370" y="220" width="280" height="86" rx="6" class="envfix" data-series="environment fix"/>
  <text x="510.0" y="258.0" text-anchor="middle" class="label">Environment fault</text>
  <text x="510.0" y="278.0" text-anchor="middle" class="small">fix it where it runs, rerun</text>
  <path d="M 1065 180 L 1065 216" class="line"/>
  <rect x="960" y="220" width="210" height="86" rx="6" class="runner" data-series="runner"/>
  <text x="1065.0" y="248.0" text-anchor="middle" class="label">Release gates</text>
  <text x="1065.0" y="268.0" text-anchor="middle" class="small">oracle 1 x2, nop 0 x2</text>
  <text x="1065.0" y="288.0" text-anchor="middle" class="small">defect witness</text>
  <path d="M 1065 306 L 1065 336 L 260 336 L 260 376" class="line"/>
  <text x="700" y="328" text-anchor="middle" class="edge">all gates pass</text>
  <rect x="130" y="380" width="260" height="70" rx="6" class="tasks" data-series="benchmark-errata"/>
  <text x="260.0" y="410.0" text-anchor="middle" class="label">active</text>
  <text x="260.0" y="430.0" text-anchor="middle" class="small">upstream open</text>
  <rect x="470" y="380" width="260" height="70" rx="6" class="tasks" data-series="benchmark-errata"/>
  <text x="600.0" y="410.0" text-anchor="middle" class="label">upstream_fixed</text>
  <text x="600.0" y="430.0" text-anchor="middle" class="small">fixed upstream, old pin</text>
  <rect x="810" y="380" width="360" height="70" rx="6" class="tasks" data-series="benchmark-errata"/>
  <text x="990.0" y="410.0" text-anchor="middle" class="label">retired</text>
  <text x="990.0" y="430.0" text-anchor="middle" class="small">source pinned past the fix</text>
  <path d="M 390 415 L 466 415" class="line"/>
  <text x="430" y="372" text-anchor="middle" class="edge">upstream fix</text>
  <path d="M 730 415 L 806 415" class="line"/>
  <text x="770" y="372" text-anchor="middle" class="edge">pin fixed source</text>
  <path d="M 260 450 L 260 495 L 600 495 L 600 450" stroke="#344054" stroke-width="2" fill="none"/>
  <path d="M 384.8 495 L 384.8 536" class="line"/>
  <text x="396.8" y="525" text-anchor="start" class="edge">applied by task id</text>
  <rect x="130.0" y="540" width="156" height="80" rx="6" class="runner" data-series="runner"/>
  <text x="208.0" y="575.0" text-anchor="middle" class="label">Materialize</text>
  <text x="208.0" y="595.0" text-anchor="middle" class="small">pinned source</text>
  <rect x="306.8" y="540" width="156" height="80" rx="6" class="tasks" data-series="benchmark-errata"/>
  <text x="384.8" y="565.0" text-anchor="middle" class="label">Apply errata</text>
  <text x="384.8" y="585.0" text-anchor="middle" class="small">hash check</text>
  <text x="384.8" y="605.0" text-anchor="middle" class="small">fail closed</text>
  <rect x="483.6" y="540" width="156" height="80" rx="6" class="runner" data-series="runner"/>
  <text x="561.6" y="575.0" text-anchor="middle" class="label">Runner edits</text>
  <text x="561.6" y="595.0" text-anchor="middle" class="small">after the errata</text>
  <rect x="660.4" y="540" width="156" height="80" rx="6" class="runner" data-series="runner"/>
  <text x="738.4" y="565.0" text-anchor="middle" class="label">Prepare images</text>
  <text x="738.4" y="585.0" text-anchor="middle" class="small">rebuild if build</text>
  <text x="738.4" y="605.0" text-anchor="middle" class="small">inputs changed</text>
  <rect x="837.2" y="540" width="156" height="80" rx="6" class="runner" data-series="runner"/>
  <text x="915.2" y="575.0" text-anchor="middle" class="label">Run</text>
  <text x="915.2" y="595.0" text-anchor="middle" class="small">trials</text>
  <rect x="1014.0" y="540" width="156" height="80" rx="6" class="runner" data-series="runner"/>
  <text x="1092.0" y="575.0" text-anchor="middle" class="label">Report</text>
  <text x="1092.0" y="595.0" text-anchor="middle" class="small">errata used</text>
  <path d="M 286.0 580 L 302.8 580" class="line"/>
  <path d="M 462.8 580 L 479.6 580" class="line"/>
  <path d="M 639.6 580 L 656.4 580" class="line"/>
  <path d="M 816.4 580 L 833.2 580" class="line"/>
  <path d="M 993.2 580 L 1010.0 580" class="line"/>
  <rect x="130" y="648" width="22" height="16" rx="3" class="tasks" data-series="benchmark-errata"/>
  <text x="160" y="662" class="edge">benchmark-errata</text>
  <rect x="320" y="648" width="22" height="16" rx="3" class="runner" data-series="runner"/>
  <text x="350" y="662" class="edge">runner, e.g. a Harbor-based harness</text>
  <rect x="653" y="648" width="22" height="16" rx="3" class="envfix" data-series="environment fix"/>
  <text x="683" y="662" class="edge">environment fix, no erratum</text>
  <rect x="926" y="648" width="22" height="16" rx="3" class="decision" data-series="decision"/>
  <text x="956" y="662" class="edge">triage question</text>
</svg>
